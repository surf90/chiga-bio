name: Update sitemap lastmod

# コンテンツ更新の push 時に sitemap.xml の lastmod を当日へ自動更新する。
# GITHUB_TOKEN による push は新たなワークフローを起動しないため、ループしない。
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'

permissions:
  contents: write

concurrency:
  group: update-sitemap
  cancel-in-progress: true

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update lastmod to today (JST)
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          sed -i -E "s#<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>#<lastmod>${TODAY}</lastmod>#" sitemap.xml

      - name: Commit if changed
        run: |
          if git diff --quiet sitemap.xml; then
            echo "sitemap.xml に変更なし。スキップします。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: sitemap.xml の lastmod を自動更新"
          git push
